name: Publish CMA anniversary site

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify static site and search indexing preference
        shell: bash
        run: |
          test -f dist/index.html
          grep -q 'name="robots" content="noindex, nofollow, noimageindex"' dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site from dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
